services:
  chromadb:
    image: chromadb/chroma:1.0.15
    ports:
      - "7777:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  intelligence:
    build:
      context: .
      dockerfile: docker/intelligence.Dockerfile
    ports:
      - "${INTELLIGENCE_PORT:-28080}:28080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',28080)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      chromadb:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PYTHON_INTELLIGENCE_ADDR=intelligence:28080
    restart: unless-stopped
    depends_on:
      intelligence:
        condition: service_healthy

volumes:
  chroma_data: