<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keiro — Health</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav>
    <a href="/gateway/static" class="nav-brand">
        <div class="nav-logo">K</div>
        <span class="nav-wordmark">Kei<em>ro</em></span>
    </a>
    <div class="nav-links">
        <a href="/gateway/static" class="nav-link">Query</a>
        <a href="/ingest" class="nav-link">Ingest</a>
        <a href="/health-ui" class="nav-link active">Health</a>
    </div>
    <div class="nav-right">
        <span class="nav-pill">v1</span>
    </div>
</nav>

<div class="cred-bar">
    <label>X-Secret</label>
    <input id="cred-secret" class="cred-input secret" type="password" placeholder="your shared secret"/>
    <label>Namespace</label>
    <input id="cred-namespace" class="cred-input" type="text" placeholder="e.g. namespace1"/>
    <div class="cred-status" style="margin-left:auto;">
        <div class="cred-dot" id="cred-dot"></div>
        <span id="cred-status-text" style="font-size:0.75rem; color:var(--text-muted);">Not configured</span>
    </div>
</div>

<div class="page-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;">
        <div class="page-header" style="margin-bottom:0;">
            <h1>System Health Dashboard</h1>
            <p>Live status of all Keiro infrastructure components.</p>
        </div>
        <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);" id="refresh-note">
            [ Auto-refreshing every 10s ]
        </span>
    </div>

    <div id="health-grid">
        <div style="text-align:center;padding:3rem;color:var(--text-muted);">
            <div class="spinner" style="margin:0 auto 0.75rem;"></div>
            <p style="font-size:0.85rem;">Checking services...</p>
        </div>
    </div>
</div>

<footer>
    Keiro — Self-hostable Adaptive RAG &nbsp;·&nbsp;
    Built with <span class="go">Go</span> + <span class="py">Python</span>
</footer>

<script src="/static/js/app.js"></script>
<script>
    async function loadHealth() {
        try {
            const data = await KEIRO.health();
            renderHealth(data);
        } catch (err) {
            document.getElementById('health-grid').innerHTML = `
            <div class="card" style="border-color:var(--error);">
                <p style="color:var(--error);font-size:0.88rem;">&#9888; Failed to fetch health data: ${KEIRO.escapeHTML(err.message)}</p>
            </div>`;
        }
    }

    function serviceCard(iconSrc, iconAlt, isUp, name, latency, isFuture, iconPlaceholder) {
        const dotClass    = isFuture ? 'pending' : (isUp ? 'up' : 'down');
        const statusClass = isFuture ? 'pending' : (isUp ? 'up' : 'down');
        const statusText  = isFuture ? 'PENDING' : (isUp ? 'UP' : 'DOWN');
        const futureTag   = isFuture
            ? `<span style="font-size:0.7rem;padding:0.15rem 0.5rem;background:var(--pending-bg);color:var(--text-muted);border-radius:4px;font-weight:500;margin-left:0.4rem;">Future</span>`
            : '';
        const iconHTML = iconSrc
            ? `<img src="${iconSrc}" alt="${iconAlt}" class="service-icon"/>`
            : `<div class="service-icon-placeholder">${iconPlaceholder}</div>`;

        return `
        <div class="service-card ${isFuture ? 'style="opacity:0.6;"' : ''}">
            ${iconHTML}
            <div class="service-info">
                <div class="service-status-row">
                    <div class="status-dot ${dotClass}"></div>
                    <span class="service-status-text ${statusClass}">${statusText}</span>
                    ${futureTag}
                </div>
                <div class="service-name">${name}</div>
                <div class="service-latency">Response Time: ${latency}</div>
            </div>
        </div>`;
    }

    function renderHealth(data) {
        const gatewayUp = data.gateway_up !== undefined ? data.gateway_up : true;
        const intelUp   = data.intelligence_up !== undefined ? data.intelligence_up : false;
        const chromaUp  = data.chromadb_up !== undefined ? data.chromadb_up : false;

        const gatewayLatency = data.gateway_latency || '< 1ms';
        const intelLatency   = data.intelligence_latency || 'N/A';
        const chromaLatency  = data.chromadb_latency || 'N/A';

        const grid = `
        <div class="grid-2" style="margin-bottom:1.25rem;">
            ${serviceCard('/static/images/go-icon.png', 'Go', gatewayUp, 'Go Gateway', gatewayLatency, false, '')}
            ${serviceCard('/static/images/python-icon.png', 'Python', intelUp, 'Python Intelligence Service', intelLatency, false, '')}
            ${serviceCard('/static/images/chroma-icon.png', 'ChromaDB', chromaUp, 'ChromaDB', chromaLatency, false, '')}
            ${serviceCard('', '', false, 'Redis', 'N/A', true, '🗄')}
        </div>
        <div class="card fade-up">
            <div class="card-label" style="margin-bottom:0.875rem;">Cache Operations Metrics</div>
            <div class="grid-2">
                <div>
                    <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem;">Current Cache Size</div>
                    <div style="font-size:1.75rem;font-weight:700;font-family:var(--font-mono);color:var(--text);">${data.cache_size || '0 entries'}</div>
                </div>
                <div>
                    <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem;">Hit Rate</div>
                    <div style="font-size:1.75rem;font-weight:700;font-family:var(--font-mono);color:var(--go-cyan);">${data.cache_hit_rate || '0.0%'}</div>
                    <div style="margin-top:0.5rem;height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
                        <div style="height:100%;width:${data.cache_hit_rate_pct || 0}%;background:var(--go-cyan);border-radius:3px;transition:width 0.4s ease;"></div>
                    </div>
                </div>
            </div>
            <p style="font-size:0.72rem;color:var(--text-light);margin-top:0.875rem;">* Data from internal cache counters</p>
        </div>`;

        document.getElementById('health-grid').innerHTML = grid;
        document.getElementById('refresh-note').textContent =
            `[ Last refreshed ${new Date().toLocaleTimeString()} — refreshing every 10s ]`;
    }

    // Initial load + polling
    document.addEventListener('DOMContentLoaded', () => {
        loadHealth();
        setInterval(loadHealth, 10000);
    });
</script>
</body>
</html>
