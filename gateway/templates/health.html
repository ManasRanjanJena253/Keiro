{{template "base.html" .}}

{{define "title"}}Health — Keiro{{end}}

{{define "styles"}}
<style>
    .health-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.25rem;
    }

    .service-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        box-shadow: var(--shadow);
        transition: box-shadow 0.15s ease;
    }

    .service-card:hover { box-shadow: var(--shadow-hover); }

    .service-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: contain;
        flex-shrink: 0;
    }

    .service-info { flex: 1; }

    .service-status-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 0.2rem;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .status-dot.up { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    .status-dot.warning { background: var(--warning); box-shadow: 0 0 6px rgba(245,158,11,0.5); }
    .status-dot.down { background: var(--error); box-shadow: 0 0 6px rgba(239,68,68,0.5); }
    .status-dot.pending { background: var(--pending); }

    .status-text {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .status-text.up { color: #15803d; }
    .status-text.warning { color: #b45309; }
    .status-text.down { color: #dc2626; }
    .status-text.pending { color: var(--text-muted); }

    .service-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.1rem;
    }

    .service-meta {
        font-size: 0.78rem;
        color: var(--text-muted);
        font-family: 'JetBrains Mono', monospace;
    }

    .future-tag {
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        background: var(--pending-light);
        color: var(--text-muted);
        border-radius: 4px;
        font-weight: 500;
    }

    .auto-refresh-note {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: 'JetBrains Mono', monospace;
    }

    .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
    }
</style>
{{end}}

{{define "content"}}
<div class="header-row">
    <div class="page-header" style="margin-bottom:0;">
        <h1>System Health Dashboard</h1>
        <p>Live status of all Keiro infrastructure components.</p>
    </div>
    <span class="auto-refresh-note">[ Auto-refreshing in 10s ]</span>
</div>

<div id="health-status-area"
     hx-get="/v1/ui/health/status"
     hx-trigger="load, every 10s"
     hx-swap="innerHTML">
    <div style="text-align:center; padding:3rem; color:var(--text-muted);">
        <div class="spinner" style="margin:0 auto 0.75rem;"></div>
        <p style="font-size:0.85rem;">Checking services...</p>
    </div>
</div>
{{end}}
